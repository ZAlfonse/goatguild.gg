name: Deploy to S3

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    # Off the top of the hour on purpose: GitHub delays or drops :00 schedules under load.
    - cron: '17 */3 * * *' # Every 3 hours at :17: refresh Raider.io / blue posts / Forever data

permissions:
  contents: write # lets the daily run commit refreshed data back to main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh guild data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          FOREVER_GUILD_SLUG: ${{ vars.FOREVER_GUILD_SLUG }}
          FOREVER_NAMESPACE: ${{ vars.FOREVER_NAMESPACE }}
        run: node scripts/update-site-data.mjs

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "goat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: guild data refresh"
            # main may have moved while the sync ran (someone pushed); replay on top and retry.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push attempt $attempt failed; retrying"
              sleep 5
            done
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Change to your bucket's region

      - name: Deploy to S3
        run: |
          # Upload assets with long cache
          aws s3 sync ./dist s3://goatguild.gg \
            --delete \
            --cache-control "max-age=31536000" \
            --exclude "*.html" \
            --exclude "*.json"
          
          # Upload HTML with short cache
          aws s3 sync ./dist s3://goatguild.gg \
            --cache-control "max-age=3600" \
            --include "*.html" \
            --include "*.json"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E24ZXM12LE6HIT \
            --paths "/*"
